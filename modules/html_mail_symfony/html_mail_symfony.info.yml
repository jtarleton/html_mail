name: 'HTML Mail: Symfony Mailer'
type: module
description: 'Sends HTML Mail messages (the html_mail template plus plain text) through Drupal Symfony Mailer, for sites where symfony_mailer replaces the mail manager.'
package: Mail
core_version_requirement: ^10.3 || ^11
dependencies:
  - html_mail:html_mail
  - symfony_mailer:symfony_mailer
