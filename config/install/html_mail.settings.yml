# Absolute base URL for links and images in emails (e.g. https://example.com).
# Empty: the current request's scheme and host (which is "http://default" in
# drush, so set this on sites that send mail from cron or drush).
site_url: ''
# Theme whose html-mail.html.twig is used. Empty: the default theme.
theme: ''
# Name shown in the email header and footer. Empty: the site name.
brand_name: ''
# Logo shown in the header, as an absolute URL or a path on site_url
# (e.g. /themes/custom/example/logo.png). Use PNG or JPEG: many email clients
# do not show SVG or WebP. Empty: no logo.
logo_url: ''
# Logo width in pixels.
logo_width: 160
# Font stack for the default template. Email clients ignore web fonts.
font_family: "-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"
# Colors for the default template.
colors:
  text: '#1f2328'
  muted: '#59636e'
  accent: '#0b5cad'
  accent_text: '#ffffff'
  background: '#f3f4f6'
  surface: '#ffffff'
  panel: '#f6f8fa'
  border: '#e5e7eb'
  badge: '#1a7f37'
# Footer HTML for messages that do not set their own 'footer' hint.
footer: ''
